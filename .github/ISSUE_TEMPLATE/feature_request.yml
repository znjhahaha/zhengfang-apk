name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你希望的功能。

  - type: textarea
    id: problem
    attributes:
      label: 问题背景
      description: 你在使用中遇到了什么不便？或者希望解决什么问题？
      placeholder: "例如：每次查看成绩都需要切换多个页面，操作繁琐..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望如何改进？描述你期望的交互方式或功能
      placeholder: "例如：希望在首页直接显示本学期成绩概览..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他替代方案
      description: 有没有其他实现方式可以考虑？

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、参考链接或其他有助于理解需求的内容