name: Promote verified test APK
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '已由用户验收、源码已进入 main 的成功测试运行 ID'
        required: true
      force_update:
        description: '紧急版本强提醒；普通更新保持关闭'
        type: boolean
        default: false
      sync_gitee_metadata:
        description: '同步旧客户端版本提示和公告，不上传 Gitee APK'
        type: boolean
        default: true
      preserve_legacy_entry:
        description: '保留旧版 version.json 的98迁移入口，仅更新新版签名清单'
        type: boolean
        default: true
permissions:
  contents: write
  actions: read
concurrency:
  group: app-updates-stable
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Require synchronized plugin SDK, website and audit contract
        timeout-minutes: 3
        run: python3 scripts/check_plugin_platform.py
      - name: Promote the exact tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ inputs.run_id }}
        run: python3 scripts/promote_release.py --run-id "$VERIFIED_RUN" --directory promoted
      - uses: actions/upload-artifact@v4
        with:
          name: promoted-apk
          path: promoted/
          compression-level: 0
          retention-days: 7
  mirrors:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: distribution/package-lock.json
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: promoted-apk
          path: promoted
      - working-directory: distribution
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish verified stable mirrors and signed metadata
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_UPDATE_SIGNING_KEY: ${{ secrets.APP_UPDATE_SIGNING_KEY }}
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          args=()
          if [ "$FORCE_UPDATE" = true ]; then args+=(--force-update); fi
          python3 scripts/release_distribution.py deploy --apk promoted/app-release.apk --receipt promoted/receipt.json --channel stable --notes promoted/release-notes.txt --output promoted/stable-mirror.json "${args[@]}"
      - name: Summarize individual delivery targets
        if: always()
        run: python3 scripts/delivery_summary.py promoted/stable-mirror.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-mirror-report
          path: |
            promoted/stable-mirror.json
            promoted/stable-mirror.json.timings.json
          retention-days: 7
  gitee-metadata:
    if: inputs.sync_gitee_metadata
    needs: mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: stable-mirror-report
          path: report
      - name: Publish small metadata independently
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          PRESERVE_LEGACY: ${{ inputs.preserve_legacy_entry }}
        run: |
          args=()
          if [ "$PRESERVE_LEGACY" = true ]; then args+=(--signed-only); fi
          python3 scripts/publish_update_metadata.py --manifest report/stable-mirror.json "${args[@]}"
