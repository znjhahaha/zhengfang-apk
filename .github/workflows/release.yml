name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: '更新日志（每行一条，支持 \n 换行）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-key.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          RELEASE_SIGNING_CONFIG_FILE: release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Extract Version Info
        id: version
        run: |
          # 构建时 version.properties 已自动递增，读取最新值
          VERSION_CODE=$(grep 'VERSION_CODE' app/version.properties | cut -d'=' -f2 | tr -d ' ')
          VERSION_NAME=$(grep 'VERSION_NAME' app/version.properties | cut -d'=' -f2 | tr -d ' ')
          TAG="${GITHUB_REF_NAME}"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "Tag: $TAG, Version: $VERSION_NAME, Code: $VERSION_CODE"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          name: Release ${{ github.ref_name }}
          body: |
            感谢使用正方教务助手！

            **更新日志：**
            - 自动 Release 构建版本
            - 正式签名指纹校验同步已更新
            - 开源防滥用机制保护
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3

  sync-to-gitee:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./apk

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || '' }}
        run: |
          set -e

          TAG="${GITHUB_REF_NAME}"
          APK_FILE=$(find ./apk -name "*.apk" | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file not found"
            exit 1
          fi

          echo "=== Syncing $TAG to Gitee ==="
          echo "APK: $APK_FILE ($(du -h "$APK_FILE" | cut -f1))"

          # 1. 创建 Gitee Release 并上传 APK
          echo "--- Creating Gitee release ---"
          RELEASE_RESPONSE=$(curl -s -X POST \
            "https://gitee.com/api/v5/repos/znj12345/zhengfang/releases" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "tag_name=${TAG}" \
            -F "name=Release ${TAG}" \
            -F "body=${RELEASE_NOTES:-自动构建发布 ${TAG}}" \
            -F "prerelease=false")

          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            echo "WARNING: Release creation response:"
            echo "$RELEASE_RESPONSE" | jq .
            echo "Trying to upload APK to existing release..."
            RELEASE_ID=$(curl -s "https://gitee.com/api/v5/repos/znj12345/zhengfang/releases?access_token=${GITEE_TOKEN}" | \
              jq -r "[.[] | select(.tag_name==\"${TAG}\")] | .[0].id // empty")
          fi

          if [ -n "$RELEASE_ID" ]; then
            echo "Release ID: $RELEASE_ID"
            echo "--- Uploading APK to release ---"
            UPLOAD_RESPONSE=$(curl -s -X POST \
              "https://gitee.com/api/v5/repos/znj12345/zhengfang/releases/${RELEASE_ID}/attach_files" \
              -H "Authorization: Bearer ${GITEE_TOKEN}" \
              -F "file=@${APK_FILE}" \
              -F "access_token=${GITEE_TOKEN}")
            echo "Upload result: $(echo "$UPLOAD_RESPONSE" | jq -r '.browser_download_url // .message // "done"')"
          else
            echo "ERROR: Could not find or create release on Gitee"
          fi

          # 2. 更新 version.json
          echo "--- Updating version.json ---"
          DOWNLOAD_URL="https://gitee.com/znj12345/zhengfang/releases/download/${TAG}/app-release.apk"

          # 构建 version.json
          VERSION_JSON=$(jq -n \
            --argjson vc "$VERSION_CODE" \
            --arg vn "$VERSION_NAME" \
            --arg rn "${RELEASE_NOTES:-自动构建发布 ${TAG}}" \
            --arg du "$DOWNLOAD_URL" \
            '{
              versionCode: ($vc | tonumber),
              versionName: $vn,
              releaseNotes: $rn,
              downloadUrl: $du,
              forceUpdate: true
            }')

          echo "$VERSION_JSON" | jq .

          VERSION_B64=$(echo -n "$VERSION_JSON" | base64 -w 0)

          # 检查 version.json 是否已存在
          EXISTING=$(curl -s "https://gitee.com/api/v5/repos/znj12345/zhengfang/contents/version.json?access_token=${GITEE_TOKEN}" 2>/dev/null)

          if echo "$EXISTING" | jq -e '.sha' > /dev/null 2>&1; then
            OLD_SHA=$(echo "$EXISTING" | jq -r '.sha')
            echo "Updating existing version.json (sha: $OLD_SHA)"
            curl -s -X PUT \
              "https://gitee.com/api/v5/repos/znj12345/zhengfang/contents/version.json" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg token "$GITEE_TOKEN" \
                --arg msg "release: ${TAG}" \
                --arg content "$VERSION_B64" \
                --arg sha "$OLD_SHA" \
                '{access_token: $token, message: $msg, content: $content, sha: $sha}')" | \
              jq -r '.content.name // .message // "updated"'
          else
            echo "Creating new version.json"
            curl -s -X POST \
              "https://gitee.com/api/v5/repos/znj12345/zhengfang/contents/version.json" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg token "$GITEE_TOKEN" \
                --arg msg "release: ${TAG}" \
                --arg content "$VERSION_B64" \
                '{access_token: $token, message: $msg, content: $content, branch: "main"}')" | \
              jq -r '.content.name // .message // "created"'
          fi

          echo "=== Gitee sync complete ==="