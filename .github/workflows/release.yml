name: Android Test Build
run-name: Android test · ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '测试版本号；不创建正式 tag 或 Release'
        required: true
        default: 'v1.0.98'
      reuse_run_id:
        description: '仅补传：复用此运行的成功构建，留空才构建 APK'
        required: false
        default: ''
      repair_stable_tag:
        description: '只修复此既有正式版的默认更新通道；不构建、不改旧版迁移提示'
        required: false
        default: ''
      repair_stable_metadata_only:
        description: '默认通道镜像已成功时，仅补传 Gitee 签名小文件'
        type: boolean
        default: false
      legacy_test_bridge:
        description: '明确向旧客户端推送此次迁移测试包，仅更新兼容 version.json'
        type: boolean
        default: false
      sync_test_gitee:
        description: '同时将同一测试 APK 发布为 Gitee 测试附件，不改正式提示'
        type: boolean
        default: false
      preflight_only:
        description: '只核对既有官方包与部署凭据，不构建、不发布'
        type: boolean
        default: false
      deploy_test_mirror:
        description: '同步免费测试镜像并做三轮上传及完整下载校验'
        type: boolean
        required: true
        default: true
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    if: inputs.preflight_only
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Check official APK verification output and CF read access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/distribution_preflight.py
  build:
    if: ${{ !inputs.preflight_only && inputs.repair_stable_tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Reuse successful original build
        if: inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse_run_id }}
          TAG: ${{ inputs.tag }}
        run: python3 scripts/reuse_test_artifact.py --run-id "$REUSE_RUN"
      - name: Validate release scripts and select test version
        if: inputs.reuse_run_id == ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 scripts/prepare_test_release.py
      - name: Decode signing key
        if: inputs.reuse_run_id == ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
      - name: Test and build signed APK
        if: inputs.reuse_run_id == ''
        env:
          RELEASE_SIGNING_CONFIG_FILE: release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug :app:assembleRelease --no-parallel --max-workers=2 --console=plain
      - name: Bind artifact to source and check reports
        if: inputs.reuse_run_id == ''
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}
        run: |
          mkdir -p delivery
          cp app/build/outputs/apk/release/app-universal-release.apk delivery/app-release.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk delivery/
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk delivery/
          cp release-notes.txt delivery/release-notes.txt
          python3 scripts/release_distribution.py receipt --apk delivery/app-release.apk --tests app/build/test-results/testDebugUnitTest --source "$SOURCE_SHA" --build-id "$BUILD_ID" --output delivery/receipt.json
      - name: Upload signed test artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: delivery/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Preserve failed receipt diagnostics for repair
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-build-diagnostics
          path: delivery/
          compression-level: 0
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload check reports
        if: always() && inputs.reuse_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: app-check-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          retention-days: 7
      - name: Remove signing key
        if: always()
        run: rm -f app/release-key.jks
      - name: Summarize test build
        run: |
          echo 'Signed test APK ready. Main, formal tags, stable metadata and Gitee are unchanged.' >> "$GITHUB_STEP_SUMMARY"
  test-mirror:
    if: inputs.deploy_test_mirror
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: app-updates-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: distribution/package-lock.json
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: delivery
      - name: Install fixed deployment CLI
        working-directory: distribution
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test APK storage and streaming delivery
        run: |
          python3 -m unittest discover -s scripts/tests
          npm --prefix distribution test
      - name: Verify three uploads and publish test manifest
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_UPDATE_SIGNING_KEY: ${{ secrets.APP_UPDATE_SIGNING_KEY }}
        run: python3 scripts/release_distribution.py deploy --apk delivery/app-release.apk --receipt delivery/receipt.json --channel test --notes delivery/release-notes.txt --rounds 3 --output delivery/test-mirror.json
      - name: Summarize individual delivery targets
        if: always()
        run: python3 scripts/delivery_summary.py delivery/test-mirror.json
      - name: Upload mirror evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-mirror-report
          path: |
            delivery/test-mirror.json
            delivery/test-mirror.json.timings.json
          retention-days: 7
      - name: Summarize mirror state
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Test mirror: $RESULT. https://dl-test.hidisiwa.xyz" >> "$GITHUB_STEP_SUMMARY"
          echo 'A mirror failure can be retried as this job only; do not rebuild the APK.' >> "$GITHUB_STEP_SUMMARY"

  gitee-test:
    if: inputs.sync_test_gitee && !inputs.preflight_only
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: gitee-test-attachment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: delivery
      - name: Upload and verify the same test APK on Gitee
        timeout-minutes: 3
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python3 scripts/sync_gitee_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitee-test-report
          path: delivery/gitee-test.json
          retention-days: 7
      - if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "Gitee test attachment · $RESULT. Stable version.json, announcements and source main unchanged." >> "$GITHUB_STEP_SUMMARY"

  legacy-test-bridge:
    if: inputs.legacy_test_bridge && !inputs.preflight_only
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: app-updates-stable
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: delivery
      - name: Publish explicitly requested legacy migration update
        timeout-minutes: 3
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python3 scripts/bridge_legacy_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-test-bridge-report
          path: delivery/legacy-test-bridge.json
          retention-days: 7
      - if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "Legacy test update prompt · $RESULT. Ordinary optional update; formal tag, GitHub Release and stable signed channel unchanged." >> "$GITHUB_STEP_SUMMARY"

  repair-stable:
    if: inputs.repair_stable_tag != '' && !inputs.preflight_only
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: write
    concurrency:
      group: app-updates-stable
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: distribution/package-lock.json
      - working-directory: distribution
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repair default signed channel from an existing official release
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_UPDATE_SIGNING_KEY: ${{ secrets.APP_UPDATE_SIGNING_KEY }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          STABLE_TAG: ${{ inputs.repair_stable_tag }}
          METADATA_ONLY: ${{ inputs.repair_stable_metadata_only }}
        run: |
          if [ "$METADATA_ONLY" = true ]; then
            python3 scripts/bootstrap_stable_channel.py --tag "$STABLE_TAG" --metadata-only
          else
            python3 scripts/bootstrap_stable_channel.py --tag "$STABLE_TAG"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-channel-repair
          path: |
            repair/stable-bootstrap.json
            repair/stable-mirror.json
          retention-days: 7
      - if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "Default signed channel · $RESULT. Existing APK reused; legacy prompt and formal releases unchanged." >> "$GITHUB_STEP_SUMMARY"
