name: Repair existing release mirrors or metadata
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '既有正式 GitHub Release；不构建 APK'
        required: true
      target:
        description: '镜像与小型元数据单独补传'
        type: choice
        options: [metadata, mirrors]
        default: metadata
permissions:
  contents: write
concurrency:
  group: app-updates-stable
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-node@v4
        if: inputs.target == 'mirrors'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: distribution/package-lock.json
      - if: inputs.target == 'mirrors'
        working-directory: distribution
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repair mirrors from existing immutable APK
        if: inputs.target == 'mirrors'
        timeout-minutes: 13
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_UPDATE_SIGNING_KEY: ${{ secrets.APP_UPDATE_SIGNING_KEY }}
          TAG: ${{ inputs.tag }}
        run: python3 scripts/repair_delivery.py --tag "$TAG" --target mirrors
      - name: Repair small metadata without APK upload
        if: inputs.target == 'metadata'
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: python3 scripts/repair_delivery.py --tag "$TAG" --target metadata
      - name: Summarize individual delivery targets
        if: always()
        run: python3 scripts/delivery_summary.py repair/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-repair-report
          path: |
            repair/report.json
            repair/report.json.timings.json
          retention-days: 7
      - if: always()
        env:
          RESULT: ${{ job.status }}
          TARGET: ${{ inputs.target }}
        run: echo "Repair $TARGET · $RESULT. No Gradle build, APK signing or Gitee attachment upload." >> "$GITHUB_STEP_SUMMARY"
